<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#800020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#556B2F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFF0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F5DC;stop-opacity:0.95" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)" />

  <!-- Elegant "M" monogram -->
  <text
    x="50"
    y="72"
    font-family="Playfair Display, Georgia, serif"
    font-size="60"
    font-weight="700"
    fill="url(#letterGradient)"
    text-anchor="middle"
    style="font-style: italic;"
  >M</text>

  <!-- Subtle decorative dot -->
  <circle cx="50" cy="15" r="3" fill="#FFFFF0" opacity="0.8" />
</svg>
